name: Smart Password Security Lab CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run legacy API compatibility tests
        run: python -m unittest test_password_checker.py -v

      - name: Run benchmark quality evaluation
        run: python benchmarks/evaluate.py

      - name: Run JavaScript golden vector parity tests
        run: node --test tests/test_web_parity.mjs
